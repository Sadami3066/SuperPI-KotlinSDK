name: Bug Report
description: Report a bug in pi2kotlin SDK (pi-ai, pi-agent, pi-mcp, pi-coding-agent)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - pi-ai
        - pi-agent
        - pi-mcp
        - pi-coding-agent
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK Version
      placeholder: e.g. 0.7.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
